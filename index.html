<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I Love You Heart</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, S, dpr, w100;

const TEXT = 'I love you';
const N = 64;        // number of "I love you" strips around the heart
const D = 9;         // length of each strip (heart wall thickness)
const H0 = 1.4;      // height of each strip
const FOCAL = 100;
const AY = 0.6, AX = 0.25, AR = -0.25; // fixed view angles (the heart does not rotate)
const SPEED = 0.03;  // flow speed of the words around the heart (smaller = slower)

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  S = Math.min(W, H) / 38;
  ctx.font = 'bold 100px Arial, sans-serif';
  w100 = ctx.measureText(TEXT).width;
}
window.addEventListener('resize', resize);
resize();

function heart(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),
    y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) - 2.5
  };
}

function rot(p) {
  let x = p.x * Math.cos(AY) + p.z * Math.sin(AY);
  let z = -p.x * Math.sin(AY) + p.z * Math.cos(AY);
  let y = p.y;
  const y2 = y * Math.cos(AX) - z * Math.sin(AX);
  const z2 = y * Math.sin(AX) + z * Math.cos(AX);
  const x3 = x * Math.cos(AR) - y2 * Math.sin(AR);
  const y3 = x * Math.sin(AR) + y2 * Math.cos(AR);
  return { x: x3, y: y3, z: z2 };
}

function proj(r) {
  const k = FOCAL / (FOCAL + r.z + 30);
  return { x: W / 2 + r.x * S * k, y: H / 2 + r.y * S * k };
}

function frame(ms) {
  const time = ms / 1000;
  const flow = time * SPEED;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  const items = [];
  for (let i = 0; i < N; i++) {
    const t = (i / N + flow) * Math.PI * 2;
    const h = heart(t), h2 = heart(t + 0.02);
    let dx = h2.x - h.x, dy = h2.y - h.y;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const side = h.x >= 0 ? 1 : -1;
    const dd = { x: dx * side, y: dy * side };
    const z = Math.sin(time * 0.7 + i * 0.9) * 0.8;
    const P = { x: h.x, y: h.y, z };

    const rc = rot(P);
    const c = proj(rc);
    const xa = proj(rot({ x: P.x, y: P.y, z: z + side * D / 2 }));
    const xb = proj(rot({ x: P.x, y: P.y, z: z - side * D / 2 }));
    const ya = proj(rot({ x: P.x + dd.x * H0 / 2, y: P.y + dd.y * H0 / 2, z }));
    const yb = proj(rot({ x: P.x - dd.x * H0 / 2, y: P.y - dd.y * H0 / 2, z }));
    items.push({
      z: rc.z, c,
      ex: { x: xa.x - xb.x, y: xa.y - xb.y },
      ey: { x: ya.x - yb.x, y: ya.y - yb.y }
    });
  }
  items.sort((a, b) => b.z - a.z); // far first

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 100px Arial, sans-serif';
  ctx.shadowColor = '#ff4fa3';
  ctx.shadowBlur = 10;

  for (const it of items) {
    const alpha = Math.max(0.35, Math.min(1, 0.8 - it.z * 0.02));
    ctx.setTransform(it.ex.x * dpr, it.ex.y * dpr, it.ey.x * dpr, it.ey.y * dpr, it.c.x * dpr, it.c.y * dpr);
    ctx.scale(1 / w100, 0.9 / 100);
    ctx.fillStyle = 'rgba(255,110,185,' + alpha + ')';
    ctx.fillText(TEXT, 0, 0);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
