<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I Love You Heart</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, S;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(W, H) / 40;
}
window.addEventListener('resize', resize);
resize();

const TEXT = 'Inam Siam';
const LAYERS = 6;      // number of heart layers (depth)
const PER_LAYER = 18;  // texts per layer
const DEPTH = 14;      // heart thickness
const FOCAL = 90;

function heart(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),
    y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
  };
}

function project(p, a) {
  const x = p.x * Math.cos(a) + p.z * Math.sin(a);
  const z = -p.x * Math.sin(a) + p.z * Math.cos(a);
  const k = FOCAL / (FOCAL + z + 20);
  return { x: W / 2 + x * S * k, y: H / 2 + (p.y + 1) * S * k, k, z };
}

function frame(ms) {
  const time = ms / 1000;
  const angle = 0.6;             // fixed tilt: the heart itself does not rotate
  const flow = time * 0.03;      // words slowly flowing along the heart outline

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const items = [];
  for (let l = 0; l < LAYERS; l++) {
    const z = (l / (LAYERS - 1) - 0.5) * DEPTH;
    for (let i = 0; i < PER_LAYER; i++) {
      const t = ((i / PER_LAYER) + flow + l * 0.01) * Math.PI * 2;
      const h = heart(t), h2 = heart(t + 0.05);
      const a = project({ x: h.x, y: h.y, z }, angle);
      const b = project({ x: h2.x, y: h2.y, z }, angle);
      items.push({ a, rot: Math.atan2(b.y - a.y, b.x - a.x) });
    }
  }
  items.sort((u, v) => v.a.z - u.a.z); // far first

  for (const it of items) {
    const { a, rot } = it;
    const fade = Math.max(0.25, Math.min(1, 0.5 + a.k * 0.5));
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(rot);
    ctx.font = 'bold ' + (S * 0.75 * a.k) + 'px Arial, sans-serif';
    ctx.shadowColor = '#ff4fa3';
    ctx.shadowBlur = 12;
    ctx.fillStyle = 'rgba(255,105,180,' + fade + ')';
    ctx.fillText(TEXT, 0, 0);
    ctx.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
